name: desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 单元测试（离线，不调用模型）
        run: python -m unittest discover -s tests -v 2>&1 | tail -n 40
        shell: bash -o pipefail {0}
      - name: 启动器自检（随机端口 + 静态资源全部本地）
        run: python desktop/launcher.py --headless-check

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 版本号
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V=$(python -c "import lyceum; print(lyceum.__version__)"); fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "version $V"
      - name: 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt
      - name: 自检（源码）
        run: python desktop/launcher.py --headless-check
      - name: PyInstaller（onedir）
        run: pyinstaller desktop/lyceum.spec --noconfirm --distpath dist --workpath build
      - name: 自检（打包后的 Lyceum.exe）
        shell: pwsh
        run: |
          $env:LYCEUM_CHECK_LOG = "$env:RUNNER_TEMP\frozen-check.log"
          $p = Start-Process -FilePath "dist\Lyceum\Lyceum.exe" -ArgumentList "--headless-check" -Wait -PassThru
          if (Test-Path $env:LYCEUM_CHECK_LOG) { Get-Content $env:LYCEUM_CHECK_LOG -Encoding utf8 | Select-Object -Last 40 }
          if ($p.ExitCode -ne 0) { throw "frozen headless-check exit $($p.ExitCode)" }
          "{0:N1} MB" -f ((Get-ChildItem dist\Lyceum -Recurse | Measure-Object Length -Sum).Sum / 1MB)
      - name: 冒烟：真开一次窗口（WebView2）
        continue-on-error: true
        shell: pwsh
        run: |
          $env:LYCEUM_CHECK_LOG = "$env:RUNNER_TEMP\smoke.log"
          $p = Start-Process -FilePath "dist\Lyceum\Lyceum.exe" -ArgumentList "--smoke-window" -PassThru
          if (-not $p.WaitForExit(150000)) { $p.Kill(); Write-Warning "超时" }
          if (Test-Path $env:LYCEUM_CHECK_LOG) { Get-Content $env:LYCEUM_CHECK_LOG -Encoding utf8 | Select-Object -Last 30 }
          if ($p.ExitCode -ne 0) { throw "smoke-window exit $($p.ExitCode)" }
      - name: Inno Setup 6.5+ 与 WebView2 引导程序
        shell: pwsh
        run: |
          choco upgrade innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { Write-Warning "choco 升级 Inno Setup 失败，用预装版本"; $global:LASTEXITCODE = 0 }
          try {
            Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile desktop\MicrosoftEdgeWebview2Setup.exe
          } catch { Write-Warning "没下到 WebView2 引导程序，安装包里只做检测和提示" }
      - name: 生成安装包
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe", "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "找不到 ISCC.exe" }
          & $iscc "/DMyAppVersion=$env:VERSION" desktop\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC 失败" }
          Get-ChildItem dist\Lyceum-Setup-*.exe | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }
      - uses: actions/upload-artifact@v4
        with:
          name: Lyceum-Setup-windows
          path: dist/Lyceum-Setup-*.exe
          if-no-files-found: error

  macos:
    needs: test
    runs-on: macos-latest
    continue-on-error: true   # 顺带构建，失败不阻塞 Windows 和 Release
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 版本号
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V=$(python -c "import lyceum; print(lyceum.__version__)"); fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt
      - name: PyInstaller（.app）
        run: pyinstaller desktop/lyceum.spec --noconfirm --distpath dist --workpath build
      - name: 自检（打包后的 .app）
        run: dist/Lyceum.app/Contents/MacOS/Lyceum --headless-check
      - name: 生成 .dmg（未签名）
        run: |
          mkdir -p dmg && cp -R dist/Lyceum.app dmg/ && ln -s /Applications dmg/Applications
          ARCH=$(uname -m)
          hdiutil create -volname "Lyceum" -srcfolder dmg -ov -format UDZO "dist/Lyceum-${VERSION}-macOS-${ARCH}.dmg"
          ls -lh dist/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Lyceum-macOS
          path: dist/*.dmg
          if-no-files-found: error
      - name: 附到 Release（Windows 那边先建好 Release；mac 晚到也能补上）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg

  release:
    needs: [windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Lyceum-Setup-windows
          path: artifacts
      - run: ls -l artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          body: |
            ## Lyceum 学园 桌面版 ${{ github.ref_name }}

            - **Windows 10/11（64 位）**：下载 `Lyceum-Setup-*.exe` 双击安装。安装包没有代码签名，第一次运行 SmartScreen 会拦一下：点「更多信息」→「仍要运行」。
            - **macOS**（如果有 `.dmg`，构建完会自动补到这里）：未签名，拖进「应用程序」后第一次请右键 →「打开」。
            - 第一次打开是离线演示模式；右上角「设置」里填 API 地址 / Key / 模型即可接入真实模型。Key 只存在本机。
            - 数据位置：Windows `%APPDATA%\Lyceum`，macOS `~/Library/Application Support/Lyceum`。

            详见 README「桌面版安装」。
